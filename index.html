let selectedLang=localStorage.getItem("epochLang")||"de"; let selectedGroup=localStorage.getItem("epochGroup")||"";
function U(){return ui[selectedLang]||ui.de}
function updateUI(){const u=U(), meta=languages[selectedLang]||languages.de; document.documentElement.lang=meta.htmlLang; document.documentElement.dir=meta.dir; document.getElementById("siteTitle").textContent=u.title; document.getElementById("siteSubtitle").textContent=u.subtitle; document.getElementById("heading").textContent=u.heading;  document.getElementById("chooseLang").textContent=u.chooseLang; document.getElementById("chooseGroup").textContent=u.chooseGroup; document.getElementById("g57").textContent=u.g57; document.getElementById("g810").textContent=u.g810; document.getElementById("printBtn").textContent=u.print; document.getElementById("contrastToggle").textContent=u.contrast; const box=document.getElementById("moreLanguages"); document.getElementById("toggleLanguages").textContent=box.classList.contains("is-open")?u.less:u.more; document.querySelectorAll(".language-button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===selectedLang?"true":"false")); if(!selectedGroup)document.getElementById("currentSelection").textContent=u.hint; renderLetter(false);}
function renderLetter(scroll=true){if(!selectedLang||!selectedGroup)return; const data=letters[selectedLang][selectedGroup]; if(!data)return; const u=U(); document.querySelectorAll(".choice-button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.group===selectedGroup?"true":"false")); document.getElementById("currentSelection").textContent=u.selected+": "+(selectedGroup==="5-7"?u.g57:u.g810)+" · "+languages[selectedLang].label; const letter=document.getElementById("letter"); letter.hidden=false; letter.dir=data.dir; document.getElementById("letterDate").textContent=data.date; document.getElementById("addressee").textContent=data.addressee; document.getElementById("salutation").textContent=data.salutation; const intro=document.getElementById("letterIntro"); intro.innerHTML=""; data.intro.forEach(line=>{const p=document.createElement("p"); p.textContent=line; intro.appendChild(p);}); const list=document.getElementById("classList"); list.innerHTML=""; data.items.forEach(block=>{const box=document.createElement("div"); box.className="class-block"; const title=document.createElement("strong"); title.textContent=block[0]; box.appendChild(title); block[1].forEach(line=>{const p=document.createElement("p"); p.textContent=line; box.appendChild(p);}); list.appendChild(box);}); document.getElementById("signature").innerHTML=data.closing+"<br><br>"+data.signer; localStorage.setItem("epochGroup",selectedGroup); if(scroll)letter.scrollIntoView({behavior:"smooth",block:"start"});}

const fontSteps=[0.9,1,1.12,1.25,1.4]; let fontIndex=Number(localStorage.getItem("fontScaleIndex")||"1"); function applyFontScale(){fontIndex=Math.max(0,Math.min(fontSteps.length-1,fontIndex));document.documentElement.style.setProperty("--user-font-scale",fontSteps[fontIndex]);localStorage.setItem("fontScaleIndex",String(fontIndex));}
document.getElementById("fontSmaller").addEventListener("click",()=>{fontIndex--;applyFontScale();}); document.getElementById("fontLarger").addEventListener("click",()=>{fontIndex++;applyFontScale();});
