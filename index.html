let selectedLang=localStorage.getItem("epochLang")||"de"; let selectedGroup=localStorage.getItem("epochGroup")||"";
function U(){return ui[selectedLang]||ui.de}
function updateUI(){const u=U(), meta=languages[selectedLang]||languages.de; document.documentElement.lang=meta.htmlLang; document.documentElement.dir=meta.dir; document.getElementById("siteTitle").textContent=u.title; document.getElementById("siteSubtitle").textContent=u.subtitle; document.getElementById("heading").textContent=u.heading;  document.getElementById("chooseLang").textContent=u.chooseLang; document.getElementById("chooseGroup").textContent=u.chooseGroup; document.getElementById("g57").textContent=u.g57; document.getElementById("g810").textContent=u.g810; document.getElementById("printBtn").textContent=u.print; document.getElementById("contrastToggle").textContent=u.contrast; const box=document.getElementById("moreLanguages"); document.getElementById("toggleLanguages").textContent=box.classList.contains("is-open")?u.less:u.more; document.querySelectorAll(".language-button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===selectedLang?"true":"false")); if(!selectedGroup)document.getElementById("currentSelection").textContent=u.hint; renderLetter(false);}
function renderLetter(scroll=true){if(!selectedLang||!selectedGroup)return; const data=letters[selectedLang][selectedGroup]; if(!data)return; const u=U(); document.querySelectorAll(".choice-button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.group===selectedGroup?"true":"false")); document.getElementById("currentSelection").textContent=u.selected+": "+(selectedGroup==="5-7"?u.g57:u.g810)+" · "+languages[selectedLang].label; const letter=document.getElementById("letter"); letter.hidden=false; letter.dir=data.dir; document.getElementById("letterDate").textContent=data.date; document.getElementById("addressee").textContent=data.addressee; document.getElementById("salutation").textContent=data.salutation; const intro=document.getElementById("letterIntro"); intro.innerHTML=""; data.intro.forEach(line=>{const p=document.createElement("p"); p.textContent=line; intro.appendChild(p);}); const list=document.getElementById("classList"); list.innerHTML=""; data.items.forEach(block=>{const box=document.createElement("div"); box.className="class-block"; const title=document.createElement("strong"); title.textContent=block[0]; box.appendChild(title); block[1].forEach(line=>{
  if (line.includes("/")) {
    const pair = document.createElement("div");
    pair.className = "subject-pair";

    const cleanLine = line.replace(" (Gruppenzuteilung)", "");
    const hasGroupNote = line.includes("(Gruppenzuteilung)");
    const parts = cleanLine.split("/").map(part => part.trim()).filter(Boolean);

    if (hasGroupNote && parts.length >= 2) {
      const firstTerm = document.createElement("div");
      firstTerm.className = "subject-term";

      const firstLabel = document.createElement("span");
      firstLabel.className = "term-label";
      firstLabel.textContent = U().term1;

      const firstName = document.createElement("span");
      firstName.className = "subject-name";
      firstName.textContent = U().depending + parts[0] + U().or + parts[1];

      firstTerm.appendChild(firstLabel);
      firstTerm.appendChild(firstName);
      pair.appendChild(firstTerm);

      const secondTerm = document.createElement("div");
      secondTerm.className = "subject-term";

      const secondLabel = document.createElement("span");
      secondLabel.className = "term-label";
      secondLabel.textContent = U().term2;

      const secondName = document.createElement("span");
      secondName.className = "subject-name";
      secondName.textContent = U().switch;

      secondTerm.appendChild(secondLabel);
      secondTerm.appendChild(secondName);
      pair.appendChild(secondTerm);

      box.appendChild(pair);

      const note = document.createElement("p");
      note.className = "group-note";
      note.textContent = U().groupNote;
      box.appendChild(note);
    } else {
      const labels = [U().term1, U().term2];

      parts.forEach((part, index) => {
        const term = document.createElement("div");
        term.className = "subject-term";

        const label = document.createElement("span");
        label.className = "term-label";
        label.textContent = labels[index] || "Halbjahr";

        const name = document.createElement("span");
        name.className = "subject-name";
        name.textContent = part;

        term.appendChild(label);
        term.appendChild(name);
        pair.appendChild(term);
      });

      box.appendChild(pair);
    }
  } else {
    const p = document.createElement("p");
    p.textContent = line;
    box.appendChild(p);
  }
}); list.appendChild(box);}); document.getElementById("signature").innerHTML=data.closing+"<br><br>"+data.signer; localStorage.setItem("epochGroup",selectedGroup); if(scroll)letter.scrollIntoView({behavior:"smooth",block:"start"});}
document.querySelectorAll(".language-button").forEach(b=>b.addEventListener("click",()=>{selectedLang=b.dataset.lang; localStorage.setItem("epochLang",selectedLang); updateUI();}));

const fontSteps=[0.9,1,1.12,1.25,1.4]; let fontIndex=Number(localStorage.getItem("fontScaleIndex")||"1"); function applyFontScale(){fontIndex=Math.max(0,Math.min(fontSteps.length-1,fontIndex));document.documentElement.style.setProperty("--user-font-scale",fontSteps[fontIndex]);localStorage.setItem("fontScaleIndex",String(fontIndex));}
document.getElementById("fontSmaller").addEventListener("click",()=>{fontIndex--;applyFontScale();}); document.getElementById("fontLarger").addEventListener("click",()=>{fontIndex++;applyFontScale();});
const contrastToggle=document.getElementById("contrastToggle"); function applyContrastMode(enabled){document.documentElement.classList.toggle("high-contrast",enabled);contrastToggle.setAttribute("aria-pressed",enabled?"true":"false");localStorage.setItem("highContrast",enabled?"true":"false");} contrastToggle.addEventListener("click",()=>applyContrastMode(!document.documentElement.classList.contains("high-contrast")));
applyFontScale(); applyContrastMode(localStorage.getItem("highContrast")==="true"); updateUI();
